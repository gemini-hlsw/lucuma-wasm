name: Release
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check tag matches Cargo.toml version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != Cargo version $v"; exit 1; }
      - run: cargo test
      - run: wasm-pack build --release --target web --scope gemini-hlsw
      - run: node -e "const p=require('./pkg/package.json');p.type='module';p.license='BSD-3-Clause';p.repository={type:'git',url:'git+https://github.com/gemini-hlsw/lucuma-wasm.git'};require('fs').writeFileSync('pkg/package.json',JSON.stringify(p,null,2))"
      - run: cd pkg && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
